version: "3.9"

services:
  api:
    build: .
    container_name: luip-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: luip-db
    restart: always
    environment:
      POSTGRES_DB: luip
      POSTGRES_USER: luip_user
      POSTGRES_PASSWORD: luip_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: